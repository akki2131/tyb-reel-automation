name: Generate TYB Reel

on:
  schedule:
    - cron: '7 12 * * *' # 5:37 PM India Standard Time (UTC+5:30)
  workflow_dispatch:
    inputs:
      demo:
        description: "Render a demo script without calling OpenAI"
        type: boolean
        required: true
        default: true
      publish:
        description: "Publish to Instagram immediately"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: tyb-reel-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out TYB repository
        uses: actions/checkout@v4

      - name: Prepare repository-based generator
        run: |
          set -euo pipefail
          required=(
            "generate_next_reel.py"
            "TYB_Question_Bank_v2.xlsx"
            "TYB_Brand_Constitution_v1.docx"
            "assets/Template 1.1.png"
            "assets/Template 1.2.png"
            "assets/Template 2.1.png"
            "assets/Template 2.2.png"
            "assets/Template 3.1.png"
            "assets/Template 3.2.png"
            "assets/Template 4.1.png"
            "assets/Template 4.2.png"
            "assets/CTA.png"
            "assets/BGM1.mp3"
            "assets/BGM2.mp3"
            "assets/BGM3.mp3"
            "assets/BGM4.mp3"
            "assets/BGM5.mp3"
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required repository generator file is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          mkdir -p output state
          echo "Using version-controlled generator source and assets from this repository checkout."

      - name: Restore last successful rotation state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          code="$(curl --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o /tmp/tyb-state-response.json -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/object/tyb-reels/state/state.json")"
          if [ "$code" = "200" ]; then
            cp /tmp/tyb-state-response.json state/state.json
            echo "Restored successful question and asset rotation state."
          elif [ "$code" = "404" ] || { [ "$code" = "400" ] && grep -Eiq '"(error|message)"[[:space:]]*:[[:space:]]*"([^"]*object[^"]*not found|the resource was not found|no such key)' /tmp/tyb-state-response.json; }; then
            echo "No prior rotation-state object exists yet; the generator will initialise its first state."
            printf '{}\n' > state/state.json
          else
            echo "::error::Could not restore rotation state from private Storage (HTTP $code)."
            echo "Supabase response (credentials are not included):"
            head -c 1000 /tmp/tyb-state-response.json || true
            echo
            exit 1
          fi

      - name: Create Supabase job record
        run: |
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -n --arg started_at "$started_at" '{status:"running", started_at:$started_at}')"
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "$payload" \
            "$SUPABASE_URL/rest/v1/tyb_reel_jobs")"
          job_id="$(printf '%s' "$response" | jq -r '.[0].id // empty')"
          if [ -z "$job_id" ]; then
            echo "::error::Supabase did not return a job ID."
            exit 1
          fi
          echo "TYB_JOB_ID=$job_id" >> "$GITHUB_ENV"
          echo "Created TYB job record: $job_id"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg, font, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lobster fontconfig
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          FONT_FILE="$(find /usr/share/fonts -type f -iname 'lobster*.ttf' -print -quit)"
          if [ -z "$FONT_FILE" ] || [ ! -s "$FONT_FILE" ]; then
            FONT_FILE="$(find /usr/share/fonts -type f -iname 'lobster*.otf' -print -quit)"
          fi
          if [ -z "$FONT_FILE" ] || [ ! -s "$FONT_FILE" ]; then
            echo "::error::The Lobster font file was not found after installing fonts-lobster."
            fc-list | grep -i lobster || true
            exit 1
          fi
          python - "$FONT_FILE" <<'PY'
          import sys
          from PIL import ImageFont
          ImageFont.truetype(sys.argv[1], 48)
          print(f"Verified Lobster font loads in Pillow: {sys.argv[1]}")
          PY
          echo "TYB_FONT_PATH=$FONT_FILE" >> "$GITHUB_ENV"
          ffmpeg -version | head -n 1
          echo "Lobster font selected: $FONT_FILE"

      - name: Verify repository generator and required assets are present
        run: |
          required=(
            "generate_next_reel.py"
            "TYB_Question_Bank_v2.xlsx"
            "assets/Template 1.1.png"
            "assets/Template 1.2.png"
            "assets/Template 2.1.png"
            "assets/Template 2.2.png"
            "assets/Template 3.1.png"
            "assets/Template 3.2.png"
            "assets/Template 4.1.png"
            "assets/Template 4.2.png"
            "assets/CTA.png"
            "assets/BGM1.mp3"
            "assets/BGM2.mp3"
            "assets/BGM3.mp3"
            "assets/BGM4.mp3"
            "assets/BGM5.mp3"
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required repository file is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Generate and render Reel
        env:
          DEMO_MODE: ${{ inputs.demo }}
        run: |
          mkdir -p output
          echo "TYB_DEMO_MODE=$DEMO_MODE" >> "$GITHUB_ENV"
          if [ "$DEMO_MODE" = "true" ]; then
            if [ -f "state/state.json" ]; then
              cp state/state.json /tmp/tyb-state-before-demo.json
              state_existed=true
            else
              state_existed=false
            fi
            python generate_next_reel.py --demo
            if [ "$state_existed" = "true" ]; then
              cp /tmp/tyb-state-before-demo.json state/state.json
            else
              rm -f state/state.json
            fi
            echo "Demo mode: restored prior rotation state; demo question will not be consumed."
          else
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::Add OPENAI_API_KEY in GitHub repository Actions secrets before live generation."
              exit 1
            fi
            python generate_next_reel.py
          fi

      - name: Generate Instagram caption
        run: |
          set -euo pipefail
          script_file="$(find output -maxdepth 1 -type f -name '*_script.json' -print -quit)"
          if [ -z "$script_file" ]; then
            echo "::error::Cannot generate caption because the script JSON is missing."
            exit 1
          fi
          question="$(jq -r '.question' "$script_file")"
          if [ "$TYB_DEMO_MODE" = "true" ]; then
            caption="A thoughtful food question, explained simply. What do you think? Share your thoughts below. Follow @yogicbelief for more mindful food conversations. #TheYogicBelief #FoodForThought #HealthyLiving"
          else
            caption_prompt="$(jq -n --arg question "$question" --arg script "$(cat "$script_file")" '{
              question:$question,
              reel_script:$script,
              instructions:"Write one polished Instagram caption for The Yogic Belief (@yogicbelief), a thoughtful healthy-food brand. Start with an engaging opening line; add a short, accurate description tied to the question; include a natural engagement prompt; finish with 4-8 relevant hashtags. Natural Indian English, warm, clear, concise, brand-consistent. Do not mention specific menu-item names. Do not invent health or medical claims. Do not describe the Reel as AI-generated. Format the caption as exactly three content blocks: (1) the main caption copy, (2) the CTA as a standalone sentence/line, and (3) the 4-8 hashtags together on the final line. Separate block 1 from block 2 with exactly one blank line, and block 2 from block 3 with exactly one blank line. Do not put the CTA in the main paragraph. Do not add labels such as 'CTA' or 'Hashtags'. Return only the caption, no quotation marks, headings, or explanations."
            }')"
            response="$(curl --fail --silent --show-error --retry 2 \
              -X POST "https://api.openai.com/v1/chat/completions" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg model "$OPENAI_MODEL" --argjson prompt "$caption_prompt" '{
                model:$model,
                messages:[
                  {role:"system",content:"You are a careful social-media copywriter for a healthy-food brand. Follow the supplied constraints exactly."},
                  {role:"user",content:($prompt|tojson)}
                ],
                temperature:0.7
              }')")"
            caption="$(printf '%s' "$response" | jq -er '.choices[0].message.content | strings | gsub("^\\s+|\\s+$"; "")')"
          fi
          if [ -z "$caption" ] || [ "${#caption}" -gt 2200 ]; then
            echo "::error::Generated Instagram caption is empty or exceeds the 2,200-character limit."
            exit 1
          fi
          jq --arg caption "$caption" '. + {instagram_caption:$caption}' "$script_file" > "$script_file.tmp"
          mv "$script_file.tmp" "$script_file"
          printf '%s\n' "$caption" > output/instagram_caption.txt
          echo "Generated and validated Instagram caption (${#caption} characters)."

      - name: Upload rendered files to private Supabase Storage
        run: |
          set -euo pipefail
          video="$(find output -maxdepth 1 -type f -name '*.mp4' -print -quit)"
          cover="$(find output -maxdepth 1 -type f -name '*_cover.jpg' -print -quit)"
          script="$(find output -maxdepth 1 -type f -name '*_script.json' -print -quit)"
          if [ -z "$video" ] || [ -z "$cover" ] || [ -z "$script" ]; then
            echo "::error::Expected an MP4, cover JPG, and script JSON after rendering."
            exit 1
          fi
          video_path="generated/$TYB_JOB_ID/$(basename "$video")"
          cover_path="generated/$TYB_JOB_ID/$(basename "$cover")"
          script_path="generated/$TYB_JOB_ID/$(basename "$script")"
          upload() {
            local file="$1"
            local object_path="$2"
            local content_type="$3"
            curl --fail --silent --show-error --retry 2 \
              -X POST \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: $content_type" \
              -H "x-upsert: true" \
              --data-binary @"$file" \
              "$SUPABASE_URL/storage/v1/object/tyb-reels/$object_path"
          }
          upload "$video" "$video_path" "video/mp4"
          upload "$cover" "$cover_path" "image/jpeg"
          upload "$script" "$script_path" "application/json"
          echo "TYB_VIDEO_PATH=$video_path" >> "$GITHUB_ENV"
          echo "TYB_COVER_PATH=$cover_path" >> "$GITHUB_ENV"
          echo "TYB_SCRIPT_PATH=$script_path" >> "$GITHUB_ENV"
          echo "Saved rendered files to private Storage."

      - name: Upload rendered files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyb-reel-output-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*_cover.jpg
            output/*_script.json
            state/state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save Reel metadata and mark job successful
        if: success()
        run: |
          set -euo pipefail
          script_file="$(find output -maxdepth 1 -type f -name '*_script.json' -print -quit)"
          question_id="$(jq -r '.question_id' "$script_file")"
          question="$(jq -r '.question' "$script_file")"
          template_pair="$(jq -r '.template_pair' "$script_file")"
          music_index="$(jq -r '.music | capture("BGM(?<n>[0-9]+)").n | tonumber' "$script_file")"
          cta_text="$(jq -r '.cta' "$script_file")"
          cta_index="$(jq -n --arg cta "$cta_text" '(["Follow for more thoughtful conversations about food.","Know someone who would find this useful? Share this with them.","Have you ever wondered about this? Share your experience below.","Follow us for more food myths explained simply.","Share this with someone who enjoys understanding food better.","Curious about food? You\u0027re in the right place. Follow for more!","What food-related question should we discuss next? Tell us in the comments.","Share this with a health phile you know."] | index($cta)) as $i | if $i == null then null else $i + 1 end')"
          duration="$(jq -r '.duration_seconds' "$script_file")"
          caption="$(jq -r '.instagram_caption // empty' "$script_file")"
          if [ -z "$caption" ]; then
            echo "::error::Instagram caption missing from script JSON."
            exit 1
          fi
          script_json="$(jq -c . "$script_file")"
          reel_payload="$(jq -n \
            --arg job_id "$TYB_JOB_ID" \
            --arg question_id "$question_id" \
            --arg question "$question" \
            --arg caption "$caption" \
            --argjson template_pair "$template_pair" \
            --argjson music_index "$music_index" \
            --argjson cta_index "$cta_index" \
            --argjson duration "$duration" \
            '{job_id:$job_id,question_id:$question_id,approved_question:$question,caption:$caption,template_pair:$template_pair,music_index:$music_index,cta_index:$cta_index,duration_seconds:$duration}')"
          job_status="succeeded"
          if [ "$TYB_DEMO_MODE" != "true" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              --data "$reel_payload" \
              "$SUPABASE_URL/rest/v1/tyb_reels"
          else
            job_status="needs_review"
            echo "Demo output is saved for review but is not registered as a production Reel."
          fi
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          job_payload="$(jq -n \
            --arg job_status "$job_status" \
            --arg video_path "$TYB_VIDEO_PATH" \
            --arg cover_path "$TYB_COVER_PATH" \
            --arg script_path "$TYB_SCRIPT_PATH" \
            --arg completed_at "$completed_at" \
            --argjson script "$script_json" \
            '{status:$job_status,video_path:$video_path,cover_path:$cover_path,script_path:$script_path,script:$script,completed_at:$completed_at}')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$job_payload" \
            "$SUPABASE_URL/rest/v1/tyb_reel_jobs?id=eq.$TYB_JOB_ID"
          echo "Saved Reel metadata and marked job succeeded."

      - name: Mark job failed when any prior step fails
        if: failure() && env.TYB_JOB_ID != ''
        run: |
          failed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -n --arg failed_at "$failed_at" '{status:"failed",error_code:"workflow_failed",error_message:"A workflow step failed; inspect GitHub Actions logs.",completed_at:$failed_at}')"
          curl --silent --show-error \
            -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$payload" \
            "$SUPABASE_URL/rest/v1/tyb_reel_jobs?id=eq.$TYB_JOB_ID" || true

      - name: Persist rotation state after successful render and saved records
        if: success() && env.TYB_DEMO_MODE != 'true'
        run: |
          if [ ! -f "state/state.json" ]; then
            echo "::error::The renderer did not create state/state.json; refusing to advance persistent rotation state."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @state/state.json \
            "$SUPABASE_URL/storage/v1/object/tyb-reels/state/state.json"
          echo "Persisted rotation state after successful render and saved records."

      - name: Publish Reel to Instagram immediately
        if: success() && env.TYB_DEMO_MODE != 'true' && (github.event_name == 'schedule' || inputs.publish == true)
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg job_id "$TYB_JOB_ID" '{job_id:$job_id}')"
          http_code="$(curl --silent --show-error --retry 0 \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            -o /tmp/tyb-publish-response.json \
            -w "%{http_code}" \
            "$SUPABASE_URL/functions/v1/publish-tyb-reel")"
          echo "Publishing function HTTP status: $http_code"
          echo "Publishing function response:"
          cat /tmp/tyb-publish-response.json
          echo
          if ! jq -e '.ok == true and .published == true' /tmp/tyb-publish-response.json >/dev/null 2>&1; then
            echo "::error::Instagram publishing function did not confirm success (HTTP $http_code)."
            exit 1
          fi
          jq . /tmp/tyb-publish-response.json
          echo "Instagram Reel published successfully."