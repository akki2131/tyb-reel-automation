name: Deploy TYB Supabase Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-insights-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out TYB repository
        uses: actions/checkout@v4

      - name: Validate deployment secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy TYB Insights function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy fetch-tyb-reel-insights \
            --project-ref chclxenakskkdpgbidqm \
            --use-api
