name: TYB Daily Publication Watchdog

on:
  schedule:
    - cron: '*/10 12-18 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tyb-reel-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check today's publication and recover if missing
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Kolkata date +%F)"
          local_clock="$(TZ=Asia/Kolkata date +%H%M)"
          if [[ "$local_clock" -lt "1750" ]]; then
            echo "Before the 5:50 PM IST grace period; no recovery action is due."
            exit 0
          fi

          # The actual published Reel record is authoritative, even if the follow-up
          # update to the daily guard was interrupted.
          tomorrow="$(TZ=Asia/Kolkata date -d "$today + 1 day" +%F)"
          published="$(curl --fail --silent --show-error --get \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --data-urlencode "select=id,job_id,published_at" \
            --data-urlencode "publish_status=eq.published" \
            --data-urlencode "published_at=gte.$today 00:00:00+05:30" \
            --data-urlencode "published_at=lt.$tomorrow 00:00:00+05:30" \
            "$SUPABASE_URL/rest/v1/tyb_reels")"
          if [[ "$(printf '%s' "$published" | jq 'length')" -gt 0 ]]; then
            echo "A Reel is already published for $today (IST). No recovery dispatch."
            exit 0
          fi

          rows="$(curl --fail --silent --show-error --get \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --data-urlencode "select=status,claimed_at" \
            --data-urlencode "run_date=eq.$today" \
            "$SUPABASE_URL/rest/v1/tyb_daily_runs")"
          status="$(printf '%s' "$rows" | jq -r '.[0].status // "missing"')"
          claimed_at="$(printf '%s' "$rows" | jq -r '.[0].claimed_at // empty')"

          if [[ "$status" == "published" ]]; then
            echo "Daily guard already confirms publication for $today."
            exit 0
          fi
          if [[ "$status" == "claimed" && -n "$claimed_at" ]]; then
            claimed_epoch="$(date -u -d "$claimed_at" +%s)"
            now_epoch="$(date -u +%s)"
            age_minutes="$(( (now_epoch - claimed_epoch) / 60 ))"
            if [[ "$age_minutes" -lt 30 ]]; then
              echo "A generation run claimed today's slot ${age_minutes} minutes ago; allowing it to finish."
              exit 0
            fi
            echo "Daily claim is stale (${age_minutes} minutes); attempting safe recovery."
          else
            echo "No completed publication or active daily claim found (status: $status); attempting recovery."
          fi

          payload="$(jq -n --arg date "$today" '{ref:"main",inputs:{demo:"false",publish:"true",run_date:$date}}')"
          http_code="$(curl --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -o /tmp/dispatch-response.txt \
            -w "%{http_code}" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-reel.yml/dispatches")"
          if [[ "$http_code" != "204" ]]; then
            echo "::error::Recovery workflow dispatch failed (HTTP $http_code)."
            cat /tmp/dispatch-response.txt
            exit 1
          fi
          echo "Recovery generation dispatched for IST date $today."
